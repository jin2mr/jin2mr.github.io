<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUMMER FESTIVAL</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    body {
      background: #071426;
    }

    /* =====================================
       ページ全体
    ===================================== */

    .page {
      position: relative;
      height: 300vh;
    }

    /* =====================================
       空
    ===================================== */

    .sky-layer {
      position: fixed;
      inset: 0;

      pointer-events: none;

      transition: opacity 0.05s linear;
    }

    /* 昼 */

    .sky-day {
      z-index: 0;

      background: linear-gradient(
        to bottom,
        #159ee9 0%,
        #55c8f5 55%,
        #b8e8f7 100%
      );

      opacity: 1;
    }

    /* 夕方 */

    .sky-sunset {
      z-index: 0;

      background: linear-gradient(
        to bottom,
        #5367a8 0%,
        #b46f9f 30%,
        #ff8d6d 58%,
        #ffd38a 100%
      );

      opacity: 0;
    }

    /* 夜 */

    .sky-night {
      z-index: 0;

      background: linear-gradient(
        to bottom,
        #071426 0%,
        #10264c 50%,
        #263b68 100%
      );

      opacity: 0;
    }

    /* =====================================
       太陽
    ===================================== */

    .sun {
      position: fixed;

      width: 120px;
      height: 120px;

      top: 8%;
      right: 10%;

      border-radius: 50%;

      background: #fff4b0;

      box-shadow:
        0 0 40px #ffd76a,
        0 0 100px rgba(255, 215, 106, 0.7);

      z-index: 1;

      pointer-events: none;

      will-change:
        transform,
        opacity;
    }

    /* =====================================
       月
    ===================================== */

    .moon {
      position: fixed;

      width: 90px;
      height: 90px;

      top: 12%;
      left: 12%;

      border-radius: 50%;

      background: #fffde8;

      box-shadow:
        0 0 30px rgba(255, 255, 220, 0.8);

      opacity: 0;

      z-index: 1;

      pointer-events: none;
    }

    /* =====================================
       星
    ===================================== */

    .stars {
      position: fixed;
      inset: 0;

      background-image:
        radial-gradient(
          white 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      opacity: 0;

      z-index: 1;

      pointer-events: none;
    }

    /* =====================================
       雲
    ===================================== */

    .clouds-wrapper {
      position: fixed;

      top: 5%;
      left: 0;

      width: 100%;

      display: flex;
      justify-content: center;

      z-index: 2;

      pointer-events: none;

      will-change:
        transform,
        opacity,
        filter;
    }

    .clouds {
      width: 115%;
      max-width: 1600px;
      height: auto;

      display: block;
    }

    /* =====================================
       遠景
    ===================================== */

    .background-wrapper {
      position: fixed;

      left: 0;
      right: 0;

      bottom: 5%;

      display: flex;
      justify-content: center;

      z-index: 3;

      pointer-events: none;

      will-change:
        transform,
        opacity,
        filter;
    }

    .festival-background {
      width: 115%;
      max-width: 1700px;
      height: auto;

      display: block;
    }

    /* =====================================
       ステージ
    ===================================== */

    .stage-wrapper {
      position: fixed;

      left: 0;
      right: 0;
      bottom: -20px;

      display: flex;
      justify-content: center;

      z-index: 4;

      pointer-events: none;

      will-change: transform;
    }

    .stage {
      width: 95%;
      max-width: 1300px;

      display: block;
    }

    /* =====================================
       各セクション
    ===================================== */

    .section {
      position: relative;

      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      z-index: 6;
    }

    /* =====================================
       文字
    ===================================== */

    .content {
      position: relative;

      z-index: 7;

      padding: 30px;
    }

    .time {
      margin-bottom: 10px;

      font-size: 14px;
      letter-spacing: 6px;

      opacity: 0.85;
    }

    h1 {
      margin: 0;

      font-size: clamp(52px, 12vw, 120px);

      letter-spacing: 5px;

      text-shadow:
        0 5px 20px rgba(0, 0, 0, 0.3);
    }

    p {
      margin-top: 15px;

      font-size: 18px;

      opacity: 0.9;
    }

    /* =====================================
       SCROLL
    ===================================== */

    .scroll {
      position: absolute;

      bottom: 25px;

      z-index: 8;

      font-size: 12px;
      letter-spacing: 4px;

      opacity: 0.75;
    }

    /* =====================================
       スマホ
    ===================================== */

    @media (max-width: 768px) {

      .stage {
        width: 118%;
        max-width: none;
      }

      .festival-background {
        width: 165%;
        max-width: none;
      }

      .background-wrapper {
        bottom: 16%;
      }

      .clouds {
        width: 150%;
        max-width: none;
      }

      .sun {
        width: 105px;
        height: 105px;

        right: 8%;
      }

      .moon {
        width: 80px;
        height: 80px;

        left: 10%;
      }

      .content {
        transform: translateY(-90px);
      }

    }

  </style>
</head>


<body>


  <!-- =====================================
       空
  ====================================== -->

  <div class="sky-layer sky-day"></div>
  <div class="sky-layer sky-sunset"></div>
  <div class="sky-layer sky-night"></div>


  <!-- 太陽 -->

  <div class="sun"></div>


  <!-- 月 -->

  <div class="moon"></div>


  <!-- 星 -->

  <div class="stars"></div>


  <!-- =====================================
       雲
  ====================================== -->

  <div class="clouds-wrapper">

    <img
      src="clouds.png"
      class="clouds"
      alt="Clouds"
    >

  </div>


  <!-- =====================================
       遠景
  ====================================== -->

  <div class="background-wrapper">

    <img
      src="festival-background.png"
      class="festival-background"
      alt="Festival Background"
    >

  </div>


  <!-- =====================================
       ステージ
  ====================================== -->

  <div class="stage-wrapper">

    <img
      src="stage-main.png"
      class="stage"
      alt="Summer Festival Stage"
    >

  </div>


  <!-- =====================================
       ページ本体
  ====================================== -->

  <main class="page">


    <!-- DAY -->

    <section class="section">

      <div class="content">

        <div class="time">
          12:00
        </div>

        <h1>
          DAY
        </h1>

        <p>
          SUMMER FESTIVAL START
        </p>

      </div>

      <div class="scroll">
        SCROLL ↓
      </div>

    </section>


    <!-- SUNSET -->

    <section class="section">

      <div class="content">

        <div class="time">
          18:00
        </div>

        <h1>
          SUNSET
        </h1>

        <p>
          THE FESTIVAL CONTINUES
        </p>

      </div>

      <div class="scroll">
        SCROLL ↓
      </div>

    </section>


    <!-- NIGHT -->

    <section class="section">

      <div class="content">

        <div class="time">
          21:00
        </div>

        <h1>
          NIGHT
        </h1>

        <p>
          SUMMER FESTIVAL FINALE
        </p>

      </div>

    </section>


  </main>


  <!-- =====================================
       JavaScript
  ====================================== -->

  <script>

    const skyDay =
      document.querySelector('.sky-day');

    const skySunset =
      document.querySelector('.sky-sunset');

    const skyNight =
      document.querySelector('.sky-night');

    const cloudsWrapper =
      document.querySelector('.clouds-wrapper');

    const backgroundWrapper =
      document.querySelector('.background-wrapper');

    const stageWrapper =
      document.querySelector('.stage-wrapper');

    const sun =
      document.querySelector('.sun');

    const moon =
      document.querySelector('.moon');

    const stars =
      document.querySelector('.stars');


    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(value, min),
        max
      );

    }


    function updateParallax() {


      const scrollY =
        window.scrollY;


      const maxScroll =
        document.documentElement.scrollHeight
        - window.innerHeight;


      const progress =
        maxScroll > 0
          ? scrollY / maxScroll
          : 0;



      /* =====================================
         空
      ====================================== */

      const sunsetAmount =
        clamp(
          progress / 0.50,
          0,
          1
        );


      const nightAmount =
        clamp(
          (progress - 0.50) / 0.50,
          0,
          1
        );


      skyDay.style.opacity =
        1 - sunsetAmount;


      skySunset.style.opacity =
        progress < 0.5
          ? sunsetAmount
          : 1 - nightAmount;


      skyNight.style.opacity =
        nightAmount;



      /* =====================================
         雲
         一番ゆっくり
      ====================================== */

      const cloudMove =
        scrollY * -0.08;


      cloudsWrapper.style.transform =
        `translateY(${cloudMove}px)`;


      const cloudBrightness =
        1 - (nightAmount * 0.55);


      cloudsWrapper.style.filter =
        `
          brightness(${cloudBrightness})
          saturate(${1 - nightAmount * 0.3})
        `;


      cloudsWrapper.style.opacity =
        1 - (nightAmount * 0.65);



      /* =====================================
         遠景
         雲より速く
         ステージより遅く
      ====================================== */

      const backgroundMove =
        scrollY * -0.14;


      backgroundWrapper.style.transform =
        `translateY(${backgroundMove}px)`;


      const backgroundBrightness =
        1 - (nightAmount * 0.50);


      backgroundWrapper.style.filter =
        `
          brightness(${backgroundBrightness})
          saturate(${1 - nightAmount * 0.15})
        `;



      /* =====================================
         ステージ
      ====================================== */

      const stageMove =
        scrollY * -0.25;


      stageWrapper.style.transform =
        `translateY(${stageMove}px)`;



      /* =====================================
         太陽
      ====================================== */

      const sunMove =
        scrollY * 0.12;


      sun.style.transform =
        `translateY(${sunMove}px)`;


      const sunOpacity =
        clamp(
          1 - ((progress - 0.30) / 0.30),
          0,
          1
        );


      sun.style.opacity =
        sunOpacity;



      /* =====================================
         月
      ====================================== */

      const moonOpacity =
        clamp(
          (progress - 0.55) / 0.25,
          0,
          1
        );


      moon.style.opacity =
        moonOpacity;



      /* =====================================
         星
      ====================================== */

      const starsOpacity =
        clamp(
          (progress - 0.60) / 0.30,
          0,
          0.7
        );


      stars.style.opacity =
        starsOpacity;

    }


    window.addEventListener(
      'scroll',
      updateParallax,
      { passive: true }
    );


    updateParallax();

  </script>


</body>

</html>
