<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUMMER FESTIVAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      overflow-x: hidden;
    }

    body {
      background: #071426;
    }

    /* =========================
       ページ全体
    ========================= */

    .page {
      position: relative;
      height: 300vh;
    }

    /* =========================
       固定される空
    ========================= */

    .sky {
      position: fixed;
      inset: 0;

      z-index: 0;

      background: linear-gradient(
        to bottom,

        /* DAY */
        #159ee9 0%,
        #55c8f5 18%,
        #b8e8f7 30%,

        /* SUNSET */
        #ffd38a 40%,
        #ff9b6a 48%,
        #e96d86 55%,
        #855d9f 64%,

        /* NIGHT */
        #384879 74%,
        #17294f 86%,
        #071426 100%
      );

      background-size: 100% 300vh;

      transition: background-position 0.1s linear;
    }

    /* =========================
       太陽
    ========================= */

    .sun {
      position: fixed;

      width: 120px;
      height: 120px;

      top: 8%;
      right: 10%;

      border-radius: 50%;

      background: #fff4b0;

      box-shadow:
        0 0 40px #ffd76a,
        0 0 100px rgba(255, 215, 106, 0.7);

      z-index: 1;

      transition:
        transform 0.1s linear,
        opacity 0.1s linear;
    }

    /* =========================
       月
    ========================= */

    .moon {
      position: fixed;

      width: 90px;
      height: 90px;

      top: 12%;
      left: 12%;

      border-radius: 50%;

      background: #fffde8;

      box-shadow:
        0 0 30px rgba(255, 255, 220, 0.8);

      opacity: 0;

      z-index: 1;

      transition: opacity 0.1s linear;
    }

    /* =========================
       星
    ========================= */

    .stars {
      position: fixed;

      inset: 0;

      background-image:
        radial-gradient(
          white 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      opacity: 0;

      z-index: 1;

      pointer-events: none;

      transition: opacity 0.1s linear;
    }

    /* =========================
       セクション
    ========================= */

    .section {
      position: relative;

      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      z-index: 3;
    }

    /* =========================
       文字
    ========================= */

    .content {
      position: relative;

      z-index: 5;

      padding: 30px;
    }

    .time {
      font-size: 14px;
      letter-spacing: 6px;

      opacity: 0.85;

      margin-bottom: 10px;
    }

    h1 {
      margin: 0;

      font-size: clamp(52px, 12vw, 120px);

      letter-spacing: 5px;

      text-shadow:
        0 5px 20px rgba(0, 0, 0, 0.3);
    }

    p {
      margin-top: 15px;

      font-size: 18px;

      opacity: 0.9;
    }

    /* =========================
       ステージ
    ========================= */

    .stage-wrapper {
      position: fixed;

      left: 0;
      right: 0;
      bottom: -20px;

      display: flex;
      justify-content: center;

      z-index: 2;

      pointer-events: none;

      transform: translateY(0);

      will-change: transform;
    }

    .stage {
      width: 95%;
      max-width: 1300px;

      display: block;
    }

    /* =========================
       スクロール表示
    ========================= */

    .scroll {
      position: absolute;

      bottom: 25px;

      font-size: 12px;
      letter-spacing: 4px;

      opacity: 0.75;
    }

    /* =========================
       スマホ調整
    ========================= */

    @media (max-width: 768px) {

      .stage {
        width: 118%;
        max-width: none;
      }

      .sun {
        width: 105px;
        height: 105px;

        right: 8%;
      }

      .moon {
        width: 80px;
        height: 80px;

        left: 10%;
      }

      .content {
        transform: translateY(-90px);
      }
    }
  </style>
</head>


<body>

  <!-- =========================
       固定背景
  ========================== -->

  <div class="sky"></div>

  <div class="sun"></div>

  <div class="moon"></div>

  <div class="stars"></div>


  <!-- =========================
       ステージ
  ========================== -->

  <div class="stage-wrapper">

    <img
      src="stage-main.png"
      class="stage"
      alt="Summer Festival Stage"
    >

  </div>


  <!-- =========================
       ページ
  ========================== -->

  <main class="page">

    <!-- DAY -->

    <section class="section">

      <div class="content">

        <div class="time">
          12:00
        </div>

        <h1>
          DAY
        </h1>

        <p>
          SUMMER FESTIVAL START
        </p>

      </div>

      <div class="scroll">
        SCROLL ↓
      </div>

    </section>


    <!-- SUNSET -->

    <section class="section">

      <div class="content">

        <div class="time">
          18:00
        </div>

        <h1>
          SUNSET
        </h1>

        <p>
          THE FESTIVAL CONTINUES
        </p>

      </div>

      <div class="scroll">
        SCROLL ↓
      </div>

    </section>


    <!-- NIGHT -->

    <section class="section">

      <div class="content">

        <div class="time">
          21:00
        </div>

        <h1>
          NIGHT
        </h1>

        <p>
          SUMMER FESTIVAL FINALE
        </p>

      </div>

    </section>

  </main>


  <!-- =========================
       JavaScript
       パララックス処理
  ========================== -->

  <script>

    const sky =
      document.querySelector('.sky');

    const stageWrapper =
      document.querySelector('.stage-wrapper');

    const sun =
      document.querySelector('.sun');

    const moon =
      document.querySelector('.moon');

    const stars =
      document.querySelector('.stars');


    function updateParallax() {

      const scrollY =
        window.scrollY;

      const maxScroll =
        document.documentElement.scrollHeight
        - window.innerHeight;

      const progress =
        maxScroll > 0
          ? scrollY / maxScroll
          : 0;


      /*
        =========================
        空の時間変化
        =========================
      */

      const skyMove =
        progress * 200;

      sky.style.backgroundPosition =
        `center ${skyMove}%`;


      /*
        =========================
        ステージ移動
        =========================

        スクロール量の約25%だけ動かす
      */

      const stageMove =
        scrollY * -0.25;

      stageWrapper.style.transform =
        `translateY(${stageMove}px)`;


      /*
        =========================
        太陽
        =========================

        少しずつ下に沈む
      */

      const sunMove =
        scrollY * 0.12;

      sun.style.transform =
        `translateY(${sunMove}px)`;


      /*
        夕方を超えたら
        太陽を薄くする
      */

      if (progress > 0.45) {

        const sunOpacity =
          Math.max(
            0,
            1 - ((progress - 0.45) / 0.25)
          );

        sun.style.opacity =
          sunOpacity;

      } else {

        sun.style.opacity = 1;

      }


      /*
        =========================
        月
        =========================
      */

      if (progress > 0.55) {

        const moonOpacity =
          Math.min(
            1,
            (progress - 0.55) / 0.25
          );

        moon.style.opacity =
          moonOpacity;

      } else {

        moon.style.opacity = 0;

      }


      /*
        =========================
        星
        =========================
      */

      if (progress > 0.6) {

        const starsOpacity =
          Math.min(
            0.65,
            (progress - 0.6) * 1.8
          );

        stars.style.opacity =
          starsOpacity;

      } else {

        stars.style.opacity = 0;

      }

    }


    window.addEventListener(
      'scroll',
      updateParallax,
      { passive: true }
    );


    updateParallax();

  </script>


</body>

</html>
