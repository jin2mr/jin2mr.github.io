<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUMMER FESTIVAL</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background: #071426;
    }

    /* =====================================
       パララックス部分
    ===================================== */

    .parallax-area {
      position: relative;
      height: 300vh;
    }

    /* =====================================
       空
    ===================================== */

    .sky-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .sky-day {
      background: linear-gradient(
        to bottom,
        #159ee9,
        #55c8f5,
        #b8e8f7
      );
      opacity: 1;
    }

    .sky-sunset {
      background: linear-gradient(
        to bottom,
        #5367a8,
        #b46f9f,
        #ff8d6d,
        #ffd38a
      );
      opacity: 0;
    }

    .sky-night {
      background: linear-gradient(
        to bottom,
        #071426,
        #10264c,
        #263b68
      );
      opacity: 0;
    }

    /* =====================================
       太陽
    ===================================== */

    .sun {
      position: fixed;

      width: 110px;
      height: 110px;

      top: 8%;
      right: 9%;

      border-radius: 50%;

      background: #fff4b0;

      box-shadow:
        0 0 40px #ffd76a,
        0 0 100px rgba(255, 215, 106, 0.7);

      z-index: 1;

      pointer-events: none;
    }

    /* =====================================
       月
    ===================================== */

    .moon {
      position: fixed;

      width: 85px;
      height: 85px;

      top: 12%;
      left: 10%;

      border-radius: 50%;

      background: #fffde8;

      box-shadow:
        0 0 30px rgba(255,255,220,0.8);

      opacity: 0;

      z-index: 1;

      pointer-events: none;
    }

    /* =====================================
       星
    ===================================== */

    .stars {
      position: fixed;
      inset: 0;

      background-image:
        radial-gradient(
          white 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      opacity: 0;

      z-index: 1;

      pointer-events: none;
    }

    /* =====================================
       雲
    ===================================== */

    .clouds-wrapper {
      position: fixed;

      top: 5%;
      left: 0;

      width: 100%;

      display: flex;
      justify-content: center;

      z-index: 2;

      pointer-events: none;
    }

    .clouds {
      width: 150%;
      max-width: none;
      display: block;
    }

    /* =====================================
       遠景
    ===================================== */

    .background-wrapper {
      position: fixed;

      left: 0;
      right: 0;

      bottom: 16%;

      display: flex;
      justify-content: center;

      z-index: 3;

      pointer-events: none;
    }

    .festival-background {
      width: 165%;
      max-width: none;
      display: block;
    }

    /* =====================================
       ステージ
    ===================================== */

    .stage-wrapper {
      position: fixed;

      left: 0;
      right: 0;

      bottom: -20px;

      display: flex;
      justify-content: center;

      z-index: 4;

      pointer-events: none;

      will-change: transform;
    }

    .stage {
      width: 118%;
      max-width: none;
      display: block;
    }

    /* =====================================
       DAY / SUNSET / NIGHT
    ===================================== */

    .section {
      position: relative;

      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      z-index: 6;
    }

    .content {
      position: relative;

      z-index: 7;

      transform: translateY(-90px);

      padding: 30px;
    }

    .time {
      margin-bottom: 10px;

      font-size: 14px;
      letter-spacing: 6px;

      opacity: 0.85;
    }

    h1 {
      margin: 0;

      font-size: clamp(52px, 12vw, 120px);

      letter-spacing: 5px;

      text-shadow:
        0 5px 20px rgba(0,0,0,0.3);
    }

    p {
      margin-top: 15px;

      font-size: 18px;

      opacity: 0.9;
    }

    /* =====================================
       SUMMER FES ロゴ
    ===================================== */

    .festival-logo {
      display: block;

      width: 80%;
      max-width: 500px;

      height: auto;

      margin: 10px auto 20px;

      object-fit: contain;

      filter:
        drop-shadow(0 5px 12px rgba(0,0,0,0.25));
    }

    /* =====================================
       ARTISTS
    ===================================== */

    .artists-section {
      position: relative;

      z-index: 10;

      min-height: 100vh;

      background:
        linear-gradient(
          to bottom,
          #132750 0%,
          #071426 100%
        );

      padding:
        40px 18px 100px;
    }

    .artists-title {
      margin: 0 0 30px;

      text-align: center;

      font-size: 30px;
      letter-spacing: 5px;
    }

    .artists-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:
        28px 14px;

      width: 100%;
      max-width: 900px;

      margin: 0 auto;
    }

    .artist-card {
      min-width: 0;
      cursor: pointer;
    }

    .artist-image {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 10;

      border-radius: 10px;

      overflow: hidden;

      background: #111;

      border:
        1px solid rgba(255,255,255,0.65);
    }

    .artist-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .artist-name {
      margin-top: 9px;

      font-size: 17px;
      font-weight: bold;

      letter-spacing: 1px;

      color: white;
    }

    /* =====================================
       スマホ
    ===================================== */

    @media (max-width: 768px) {

      .artists-section {
        padding:
          32px 14px 80px;
      }

      .artists-title {
        margin-bottom: 25px;

        font-size: 26px;
      }

      .artists-grid {
        gap:
          25px 12px;
      }

      .artist-name {
        font-size: 15px;
      }

      .festival-logo {
        width: 92%;
        max-width: 420px;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================
       空
  ====================================== -->

  <div class="sky-layer sky-day"></div>
  <div class="sky-layer sky-sunset"></div>
  <div class="sky-layer sky-night"></div>


  <!-- =====================================
       太陽・月・星
  ====================================== -->

  <div class="sun"></div>
  <div class="moon"></div>
  <div class="stars"></div>


  <!-- =====================================
       雲
  ====================================== -->

  <div class="clouds-wrapper">

    <img
      src="clouds.png"
      class="clouds"
      alt="Clouds"
    >

  </div>


  <!-- =====================================
       遠景
  ====================================== -->

  <div class="background-wrapper">

    <img
      src="festival-background.png"
      class="festival-background"
      alt="Festival Background"
    >

  </div>


  <!-- =====================================
       ステージ
  ====================================== -->

  <div class="stage-wrapper">

    <img
      src="stage-main.png"
      class="stage"
      alt="Summer Festival Stage"
    >

  </div>


  <!-- =====================================
       DAY / SUNSET / NIGHT
  ====================================== -->

  <main class="parallax-area">


    <!-- DAY -->

    <section class="section">

      <div class="content">

        <div class="time">
          12:00
        </div>

        <img
          src="Summerfes.png"
          class="festival-logo"
          alt="SUMMER FES"
        >

        <p>
          SUMMER FESTIVAL START
        </p>

      </div>

    </section>


    <!-- SUNSET -->

    <section class="section">

      <div class="content">

        <div class="time">
          18:00
        </div>

        <h1>
          SUNSET
        </h1>

        <p>
          THE FESTIVAL CONTINUES
        </p>

      </div>

    </section>


    <!-- NIGHT -->

    <section class="section">

      <div class="content">

        <div class="time">
          21:00
        </div>

        <h1>
          NIGHT
        </h1>

        <p>
          SUMMER FESTIVAL FINALE
        </p>

      </div>

    </section>


  </main>


  <!-- =====================================
       ARTISTS
  ====================================== -->

  <section class="artists-section">

    <h2 class="artists-title">
      ARTISTS
    </h2>


    <div class="artists-grid">


      <div class="artist-card">

        <div class="artist-image">
          <img src="artist-01.png" alt="Artist 01">
        </div>

        <div class="artist-name">
          ARTIST 01
        </div>

      </div>


      <div class="artist-card">

        <div class="artist-image">
          <img src="artist-02.png" alt="Artist 02">
        </div>

        <div class="artist-name">
          ARTIST 02
        </div>

      </div>


      <div class="artist-card">

        <div class="artist-image">
          <img src="artist-03.png" alt="Artist 03">
        </div>

        <div class="artist-name">
          ARTIST 03
        </div>

      </div>


      <div class="artist-card">

        <div class="artist-image">
          <img src="artist-04.png" alt="Artist 04">
        </div>

        <div class="artist-name">
          ARTIST 04
        </div>

      </div>


      <div class="artist-card">

        <div class="artist-image">
          <img src="artist-05.png" alt="Artist 05">
        </div>

        <div class="artist-name">
          ARTIST 05
        </div>

      </div>


      <div class="artist-card">

        <div class="artist-image">
          <img src="artist-06.png" alt="Artist 06">
        </div>

        <div class="artist-name">
          ARTIST 06
        </div>

      </div>


    </div>

  </section>


  <!-- =====================================
       JavaScript
  ====================================== -->

  <script>

    const skyDay =
      document.querySelector('.sky-day');

    const skySunset =
      document.querySelector('.sky-sunset');

    const skyNight =
      document.querySelector('.sky-night');

    const cloudsWrapper =
      document.querySelector('.clouds-wrapper');

    const backgroundWrapper =
      document.querySelector('.background-wrapper');

    const stageWrapper =
      document.querySelector('.stage-wrapper');

    const sun =
      document.querySelector('.sun');

    const moon =
      document.querySelector('.moon');

    const stars =
      document.querySelector('.stars');

    const parallaxArea =
      document.querySelector('.parallax-area');


    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(value, min),
        max
      );

    }


    function updateParallax() {


      const scrollY =
        window.scrollY;


      const parallaxHeight =
        parallaxArea.offsetHeight;


      const maxParallaxScroll =
        parallaxHeight
        - window.innerHeight;


      const progress =
        clamp(
          scrollY / maxParallaxScroll,
          0,
          1
        );


      /* =====================================
         空
      ====================================== */

      const sunsetAmount =
        clamp(
          progress / 0.5,
          0,
          1
        );


      const nightAmount =
        clamp(
          (progress - 0.5) / 0.5,
          0,
          1
        );


      skyDay.style.opacity =
        1 - sunsetAmount;


      skySunset.style.opacity =
        progress < 0.5
          ? sunsetAmount
          : 1 - nightAmount;


      skyNight.style.opacity =
        nightAmount;


      /* =====================================
         雲
      ====================================== */

      cloudsWrapper.style.transform =
        `translateY(${scrollY * -0.08}px)`;


      cloudsWrapper.style.opacity =
        1 - (nightAmount * 0.65);


      cloudsWrapper.style.filter =
        `brightness(${1 - nightAmount * 0.55})`;


      /* =====================================
         遠景
      ====================================== */

      backgroundWrapper.style.transform =
        `translateY(${scrollY * -0.14}px)`;


      backgroundWrapper.style.filter =
        `brightness(${1 - nightAmount * 0.5})`;


      /* =====================================
         ステージ
      ====================================== */

      const stageHeight =
        stageWrapper.offsetHeight;


      const initialTop =
        window.innerHeight
        - stageHeight;


      const targetTop =
        0;


      const moveDistance =
        targetTop
        - initialTop;


      const stageMove =
        moveDistance * progress;


      stageWrapper.style.transform =
        `translateY(${stageMove}px)`;


      if (
        scrollY >= maxParallaxScroll
      ) {

        stageWrapper.style.transform =
          `translateY(${moveDistance}px)`;

      }


      /* =====================================
         太陽
      ====================================== */

      sun.style.transform =
        `translateY(${scrollY * 0.12}px)`;


      sun.style.opacity =
        clamp(
          1 - ((progress - 0.3) / 0.3),
          0,
          1
        );


      /* =====================================
         月
      ====================================== */

      moon.style.opacity =
        clamp(
          (progress - 0.55) / 0.25,
          0,
          1
        );


      /* =====================================
         星
      ====================================== */

      stars.style.opacity =
        clamp(
          (progress - 0.6) / 0.3,
          0,
          0.7
        );


      /* =====================================
         ARTISTSまで進んだら
         パララックス素材を非表示
      ====================================== */

      if (
        scrollY >
        maxParallaxScroll
        + window.innerHeight * 0.7
      ) {

        stageWrapper.style.opacity = 0;
        cloudsWrapper.style.opacity = 0;
        backgroundWrapper.style.opacity = 0;
        sun.style.opacity = 0;
        moon.style.opacity = 0;
        stars.style.opacity = 0;

      } else {

        stageWrapper.style.opacity = 1;

      }

    }


    window.addEventListener(
      'scroll',
      updateParallax,
      { passive: true }
    );


    window.addEventListener(
      'resize',
      updateParallax
    );


    updateParallax();

  </script>


</body>

</html>
